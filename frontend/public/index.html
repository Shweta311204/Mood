<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0c0c0d" />
        <meta
            name="description"
            content="Moods - AI-powered mood-based recommendations for movies, TV shows, books, and songs. Discover content that matches your emotions."
        />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://moods.my/">
        <meta property="og:title" content="Moods - AI-Powered Mood-Based Recommendations">
        <meta property="og:description" content="Discover movies, shows, books, and songs that match your emotions.">
        <meta property="og:image" content="%PUBLIC_URL%/og-image.png">

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image">
        <meta property="twitter:url" content="https://moods.my/">
        <meta property="twitter:title" content="Moods - AI-Powered Mood-Based Recommendations">
        <meta property="twitter:description" content="Discover movies, shows, books, and songs that match your emotions.">
        <meta property="twitter:image" content="%PUBLIC_URL%/og-image.png">

        <meta name="keywords" content="mood, recommendations, movies, books, TV shows, songs, emotions, entertainment, mood-based, personalized">

        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebApplication",
          "name": "Moods",
          "url": "https://moods.my",
          "description": "AI-powered mood-based recommendations for movies, TV shows, books, and songs",
          "applicationCategory": "Entertainment",
          "operatingSystem": "Any",
          "browserRequirements": "Requires JavaScript"
        }
        </script>

        <title>Moods - AI-Powered Mood-Based Recommendations</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!--
          NOTE: the previous version of this file hardcoded a PostHog analytics
          snippet pointing at an Emergent-platform project key. It's been
          removed since it was tied to that platform's account, not yours.
          If you want analytics, add your own PostHog (or similar) snippet
          with your own project key here.
        -->
    </body>
</html>
